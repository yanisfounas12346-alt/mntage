name: Python checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all project modules
        run: python -m compileall -q app.py stock_media.py video_factory.py subtitles.py tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check FFmpeg availability
        run: |
          ffmpeg -version
          ffmpeg -filters | grep -E '(^| )ass '
