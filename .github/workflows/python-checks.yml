name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all project modules
        run: python -m compileall -q app.py job_store.py stock_media.py video_factory.py subtitles.py tests
      # The latest Ubuntu runner image does not necessarily bundle FFmpeg.
      # Install the real encoder before smoke tests rather than assuming PATH.
      - name: Install FFmpeg on Ubuntu
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
      - name: Check FFmpeg and subtitle filter
        run: |
          ffmpeg -version
          ffmpeg -filters | grep -E '(^| )ass '
      - name: Run offline regression and real FFmpeg smoke tests
        run: python -m unittest discover -s tests -v
      - name: Run checkpoint 10 of 600 on Linux
        if: github.head_ref == 'optimization-010-media-checkpoint' || github.ref_name == 'optimization-010-media-checkpoint'
        run: python -m tools.checkpoint --iteration 10 --no-pull
      - name: Save checkpoint 10 report (Linux)
        if: always() && (github.head_ref == 'optimization-010-media-checkpoint' || github.ref_name == 'optimization-010-media-checkpoint')
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-0010-linux
          path: outputs/checkpoints/cycle_0010*
          if-no-files-found: ignore
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics
          path: outputs/
          if-no-files-found: ignore

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg with subtitle support
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ffmpeg -version
      - name: Prepare Windows virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Run the same Windows verification as local users
        shell: pwsh
        run: .\verify_windows.ps1
      - name: Run checkpoint 10 of 600 on Windows
        if: github.head_ref == 'optimization-010-media-checkpoint' || github.ref_name == 'optimization-010-media-checkpoint'
        shell: pwsh
        run: & .\.venv\Scripts\python.exe -m tools.checkpoint --iteration 10 --no-pull
      - name: Save checkpoint 10 report (Windows)
        if: always() && (github.head_ref == 'optimization-010-media-checkpoint' || github.ref_name == 'optimization-010-media-checkpoint')
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-0010-windows
          path: outputs/checkpoints/cycle_0010*
          if-no-files-found: ignore
