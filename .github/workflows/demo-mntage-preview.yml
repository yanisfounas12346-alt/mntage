name: MNTAGE eight-second preview
on:
  push:
    branches: [demo-mntage-miroir-huit-secondes]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          python -m pip install 'Pillow>=10,<12'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
      - name: Render original motion studio demo
        run: python -m tools.render_mirror_demo
      - name: Validate playable MP4
        run: |
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 outputs/demo/MNTAGE_demo_miroir_8s.mp4
          ffmpeg -v error -i outputs/demo/MNTAGE_demo_miroir_8s.mp4 -f null -
      - name: Upload demo video and poster
        uses: actions/upload-artifact@v4
        with:
          name: MNTAGE-demo-miroir-8s
          path: |
            outputs/demo/MNTAGE_demo_miroir_8s.mp4
            outputs/demo/MNTAGE_demo_affiche.png
          if-no-files-found: error
          retention-days: 7
